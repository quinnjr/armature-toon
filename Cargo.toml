[package]
name = "armature-toon"
version = "0.5.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-toon"
homepage = "https://quinnjr.github.io/armature"
description = "TOON (Token-Oriented Object Notation) support for Armature framework - optimized for LLM applications"
keywords = ["toon", "serialization", "llm", "tokens", "armature"]
categories = ["encoding", "web-programming"]

[features]
default = []
# Enable HTTP response/request integration
http = ["dep:armature-core", "dep:bytes"]
# Enable streaming TOON parsing
streaming = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_toon = "0.2"
serde_json = "1.0"
thiserror = "2.0"
armature-log = { version = "0.2" }

# Optional dependencies
armature-core = { version = "0.10", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

